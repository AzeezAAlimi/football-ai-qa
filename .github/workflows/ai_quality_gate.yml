name: AI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate AI test suite structure
        run: pytest test_golden_dataset.py -v -k "smoke"

      - name: Display quality gate status
        run: |
          echo "✅ AI Quality Gate passed"
          echo "📊 Full evaluation suite: 20 test cases"
          echo "📏 Relevancy threshold: 0.8"
          echo "📏 Faithfulness threshold: 0.9"
          echo "🔍 Full evaluation runs locally with Ollama judge"
          echo "🚀 Pipeline ready for cloud judge integration"